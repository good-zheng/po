<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#0E1728"/>
      <stop offset="1" stop-color="#160F2B"/>
    </linearGradient>
    <radialGradient id="og-b" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0161EF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0161EF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-o" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-v" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-p" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#334155" fill-opacity=".55"/>
    </pattern>
  </defs>

  <rect width="1200" height="628" fill="url(#og-bg)"/>
  <rect width="1200" height="628" fill="url(#og-p)"/>
  <ellipse cx="140" cy="120" rx="380" ry="280" fill="url(#og-b)"/>
  <ellipse cx="1080" cy="560" rx="320" ry="240" fill="url(#og-o)"/>
  <ellipse cx="1010" cy="110" rx="280" ry="220" fill="url(#og-v)"/>

  <text x="80" y="216" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="132" font-weight="700" fill="#F7F4EE">叮叮厨</text>
  <circle cx="504" cy="182" r="18" fill="#FB923C"/>
  <text x="80" y="304" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="52" font-weight="700" fill="#93C5FD">会说话的菜谱与 AI 做菜助手</text>
  <path d="M80 356 h520" stroke="#243252" stroke-width="4"/>
  <text x="80" y="424" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" fill="#94A3B8">独立开发 · 全栈作品</text>
  <text x="80" y="486" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" fill="#64748B">三端客户端 · 两个后端 · 一条 AI 链路</text>

  <!-- 右侧：做菜模式手机 -->
  <g transform="translate(760 96) scale(0.86)">
