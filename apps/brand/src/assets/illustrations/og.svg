      <path d="M0 0 v-30" stroke="#F7F4EE" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 0 h22" stroke="#F7F4EE" stroke-width="8" stroke-linecap="round" opacity=".75"/>
    </g>
    <g fill="#8B5CF6" transform="translate(40 372)">
