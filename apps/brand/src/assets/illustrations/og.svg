    <rect x="40" y="98" width="160" height="112" rx="16" fill="#16213A" stroke="#243252" stroke-width="2"/>
    <rect x="58" y="120" width="96" height="11" rx="5.5" fill="#93C5FD"/>
    <rect x="58" y="146" width="126" height="9" rx="4.5" fill="#334155"/>
