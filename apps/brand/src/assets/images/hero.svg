<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="插画：手机立在厨房台面上，屏幕上是分步的做菜界面，旁边有语音气泡和计时环">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#120E24"/>
    </linearGradient>
    <radialGradient id="h-glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0161EF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0161EF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glow-orange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2436"/>
      <stop offset="1" stop-color="#0D1524"/>
    </linearGradient>
    <linearGradient id="h-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111C2E"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <pattern id="h-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#334155" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" rx="32" fill="url(#h-bg)"/>
  <rect width="1280" height="720" rx="32" fill="url(#h-dots)"/>
  <ellipse cx="250" cy="150" rx="330" ry="240" fill="url(#h-glow-blue)"/>
  <ellipse cx="1080" cy="620" rx="320" ry="230" fill="url(#h-glow-orange)"/>
  <ellipse cx="980" cy="140" rx="260" ry="200" fill="url(#h-glow-violet)"/>

  <!-- 台面 -->
  <path d="M0 596 H1280 V720 H0 Z" fill="#080E1A" fill-opacity="0.72"/>
  <line x1="0" y1="596" x2="1280" y2="596" stroke="#1E2B44" stroke-width="2"/>

  <!-- 蒸汽 -->
  <g stroke="#93C5FD" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M266 452 c-26 -34 26 -58 0 -92 c-22 -28 14 -46 2 -70"/>
    <path d="M332 470 c-22 -30 22 -50 0 -80 c-18 -24 12 -40 2 -60"/>
  </g>

  <!-- 平底锅 -->
  <g>
    <ellipse cx="290" cy="584" rx="122" ry="30" fill="#0A1120"/>
    <circle cx="266" cy="524" r="92" fill="#16213A" stroke="#2A3A5C" stroke-width="6"/>
    <circle cx="266" cy="524" r="62" fill="#0E1728"/>
    <rect x="342" y="546" width="130" height="20" rx="10" fill="#1F2A44" transform="rotate(24 342 546)"/>
    <circle cx="244" cy="512" r="13" fill="#FB923C" opacity="0.9"/>
    <circle cx="282" cy="536" r="10" fill="#F87171" opacity="0.85"/>
  </g>

  <!-- 木勺与蒜 -->
  <g>
    <rect x="880" y="500" width="230" height="18" rx="9" fill="#8B5E34" transform="rotate(-14 880 500)"/>
    <ellipse cx="872" cy="512" rx="40" ry="30" fill="#A9754A" transform="rotate(-14 872 512)"/>
    <ellipse cx="872" cy="512" rx="26" ry="18" fill="#7C5230" transform="rotate(-14 872 512)"/>
    <g transform="translate(1064 520)">
      <ellipse rx="46" ry="42" fill="#F7F4EE"/>
      <path d="M0 -42 C 22 -14 22 18 0 40 M0 -42 C -22 -14 -22 18 0 40" stroke="#D9D3C6" stroke-width="4" fill="none"/>
      <path d="M-6 -42 q-4 -22 4 -30 q10 8 6 30" fill="#34D399" opacity="0.9"/>
    </g>
    <!-- 香草叶 -->
    <g transform="translate(1150 470) rotate(24)">
      <path d="M0 0 C 34 -12 62 8 66 40 C 30 46 4 30 0 0 Z" fill="#34D399" opacity="0.85"/>
      <path d="M6 6 L 58 34" stroke="#065F46" stroke-width="4" opacity="0.6"/>
    </g>
  </g>

  <!-- 手机：做菜模式 -->
  <g>
    <rect x="510" y="96" width="272" height="520" rx="42" fill="url(#h-phone)" stroke="#2A3A5C" stroke-width="3"/>
    <rect x="528" y="114" width="236" height="484" rx="30" fill="url(#h-screen)"/>
    <rect x="608" y="126" width="76" height="10" rx="5" fill="#1E2B44"/>

    <!-- 顶部进度 -->
    <rect x="548" y="158" width="120" height="12" rx="6" fill="#1E2B44"/>
    <rect x="548" y="158" width="72" height="12" rx="6" fill="#0161EF"/>
    <circle cx="742" cy="164" r="10" fill="#FB923C"/>

    <!-- 当前步骤卡 -->
    <rect x="548" y="192" width="196" height="132" rx="18" fill="#16213A" stroke="#243252" stroke-width="2"/>
    <rect x="568" y="214" width="118" height="12" rx="6" fill="#93C5FD"/>
    <rect x="568" y="240" width="156" height="10" rx="5" fill="#334155"/>
    <rect x="568" y="262" width="132" height="10" rx="5" fill="#334155"/>
    <rect x="568" y="284" width="88" height="10" rx="5" fill="#334155"/>

    <!-- 计时环 -->
    <g transform="translate(646 400)">
      <circle r="66" fill="none" stroke="#1B283F" stroke-width="16"/>
      <circle r="66" fill="none" stroke="#FB923C" stroke-width="16" stroke-linecap="round"
              stroke-dasharray="415" stroke-dashoffset="150" transform="rotate(-90)"/>
      <path d="M0 0 v-36" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round"/>
      <path d="M0 0 h26" stroke="#F7F4EE" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
      <circle r="6" fill="#F7F4EE"/>
    </g>

    <!-- 声波 -->
    <g fill="#8B5CF6">
      <rect x="556" y="498" width="8" height="20" rx="4"/>
      <rect x="574" y="486" width="8" height="44" rx="4"/>
      <rect x="592" y="472" width="8" height="72" rx="4"/>
      <rect x="610" y="492" width="8" height="32" rx="4"/>
      <rect x="628" y="466" width="8" height="84" rx="4"/>
      <rect x="646" y="482" width="8" height="52" rx="4"/>
      <rect x="664" y="500" width="8" height="16" rx="4"/>
      <rect x="682" y="478" width="8" height="60" rx="4"/>
      <rect x="700" y="492" width="8" height="32" rx="4"/>
      <rect x="718" y="504" width="8" height="8" rx="4"/>
    </g>

    <!-- 底部按钮 -->
    <rect x="548" y="544" width="196" height="38" rx="19" fill="#0161EF"/>
    <path d="M628 556 l16 8 l-16 8 z" fill="#F7F4EE"/>
    <rect x="652" y="560" width="58" height="8" rx="4" fill="#F7F4EE" opacity="0.85"/>
  </g>

  <!-- AI 语音气泡 -->
  <g>
    <rect x="236" y="150" width="238" height="118" rx="26" fill="#16213A" stroke="#2A3A5C" stroke-width="3"/>
    <path d="M300 268 l-8 34 l40 -26 z" fill="#16213A" stroke="#2A3A5C" stroke-width="3"/>
    <rect x="264" y="180" width="140" height="12" rx="6" fill="#8B5CF6"/>
    <rect x="264" y="208" width="182" height="10" rx="5" fill="#334155"/>
    <rect x="264" y="230" width="120" height="10" rx="5" fill="#334155"/>
  </g>

  <!-- 食材清单卡 -->
  <g>
    <rect x="812" y="222" width="216" height="150" rx="24" fill="#16213A" stroke="#2A3A5C" stroke-width="3"/>
    <g>
      <circle cx="846" cy="262" r="11" fill="#34D399"/>
      <rect x="868" y="256" width="126" height="12" rx="6" fill="#334155"/>
      <circle cx="846" cy="300" r="11" fill="#34D399"/>
      <rect x="868" y="294" width="98" height="12" rx="6" fill="#334155"/>
      <circle cx="846" cy="338" r="11" fill="none" stroke="#FB923C" stroke-width="4"/>
      <rect x="868" y="332" width="112" height="12" rx="6" fill="#1E2B44"/>
    </g>
  </g>

  <!-- 星点 -->
  <g fill="#93C5FD">
    <circle cx="176" cy="330" r="5" opacity="0.8"/>
    <circle cx="1122" cy="180" r="6" opacity="0.7"/>
    <circle cx="1042" cy="94" r="4" opacity="0.6"/>
    <circle cx="212" cy="470" r="4" opacity="0.5"/>
  </g>
</svg>
