<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="插画：两台设备显示同一屏做菜界面，中间有同步箭头，旁边是铃声与震动标记">
  <defs>
    <linearGradient id="app-bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101A2E"/>
    </linearGradient>
    <radialGradient id="app-v" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="app-o" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="app-p" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#334155" fill-opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#app-bg)"/>
  <rect width="1280" height="800" fill="url(#app-p)"/>
  <ellipse cx="1080" cy="180" rx="320" ry="240" fill="url(#app-v)"/>
  <ellipse cx="200" cy="660" rx="300" ry="220" fill="url(#app-o)"/>

  <!-- 左：手机 -->
  <g transform="translate(180 150)">
    <rect width="212" height="470" rx="36" fill="#161f33" stroke="#2A3A5C" stroke-width="3"/>
    <rect x="16" y="18" width="180" height="434" rx="26" fill="#0C1424"/>
    <rect x="72" y="30" width="68" height="9" rx="4.5" fill="#1E2B44"/>
    <rect x="34" y="58" width="144" height="12" rx="6" fill="#93C5FD"/>
    <rect x="34" y="84" width="104" height="9" rx="4.5" fill="#334155"/>
    <rect x="34" y="112" width="144" height="112" rx="16" fill="#16213A"/>
    <rect x="52" y="132" width="88" height="10" rx="5" fill="#8B5CF6"/>
    <rect x="52" y="156" width="108" height="8" rx="4" fill="#334155"/>
    <rect x="52" y="176" width="72" height="8" rx="4" fill="#334155"/>
    <circle cx="106" cy="290" r="52" fill="none" stroke="#1B283F" stroke-width="14"/>
    <circle cx="106" cy="290" r="52" fill="none" stroke="#FB923C" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="327" stroke-dashoffset="120" transform="rotate(-90 106 290)"/>
    <rect x="34" y="372" width="144" height="40" rx="20" fill="#0161EF"/>
    <path d="M84 384 l14 8 l-14 8 z" fill="#F7F4EE"/>
    <rect x="106" y="388" width="46" height="8" rx="4" fill="#F7F4EE" opacity=".85"/>
  </g>

  <!-- 同步箭头 -->
  <g transform="translate(424 360)">
    <path d="M0 0 h180" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 16"/>
    <path d="M172 -22 l30 22 l-30 22 z" fill="#34D399"/>
  </g>

  <!-- 右：平板 -->
  <g transform="translate(660 118)">
    <rect width="360" height="520" rx="34" fill="#161f33" stroke="#2A3A5C" stroke-width="3"/>
    <rect x="18" y="18" width="324" height="484" rx="24" fill="#0C1424"/>
    <rect x="44" y="52" width="180" height="14" rx="7" fill="#93C5FD"/>
    <rect x="44" y="82" width="120" height="9" rx="4.5" fill="#334155"/>
    <g>
      <rect x="44" y="112" width="136" height="150" rx="16" fill="#16213A"/>
      <rect x="62" y="132" width="100" height="10" rx="5" fill="#8B5CF6"/>
      <rect x="62" y="156" width="84" height="8" rx="4" fill="#334155"/>
      <rect x="62" y="176" width="96" height="8" rx="4" fill="#334155"/>
      <rect x="62" y="212" width="100" height="30" rx="10" fill="#0161EF" fill-opacity=".5"/>
    </g>
    <g>
      <rect x="196" y="112" width="136" height="150" rx="16" fill="#16213A"/>
      <rect x="214" y="132" width="100" height="10" rx="5" fill="#FB923C"/>
      <rect x="214" y="156" width="84" height="8" rx="4" fill="#334155"/>
      <rect x="214" y="176" width="96" height="8" rx="4" fill="#334155"/>
      <circle cx="264" cy="226" r="18" fill="none" stroke="#34D399" stroke-width="6"/>
    </g>
    <g fill="#8B5CF6" transform="translate(44 306)">
      <rect x="0" y="22" width="11" height="26" rx="5.5"/>
      <rect x="24" y="10" width="11" height="50" rx="5.5"/>
      <rect x="48" y="0" width="11" height="70" rx="5.5"/>
      <rect x="72" y="18" width="11" height="34" rx="5.5"/>
      <rect x="96" y="6" width="11" height="58" rx="5.5"/>
      <rect x="120" y="26" width="11" height="18" rx="5.5"/>
      <rect x="144" y="14" width="11" height="42" rx="5.5"/>
      <rect x="168" y="28" width="11" height="14" rx="5.5"/>
    </g>
    <rect x="44" y="418" width="288" height="44" rx="22" fill="#0161EF"/>
    <path d="M150 432 l16 8 l-16 8 z" fill="#F7F4EE"/>
    <rect x="176" y="436" width="60" height="8" rx="4" fill="#F7F4EE" opacity=".85"/>
  </g>

  <!-- 铃声 + 震动 -->
  <g transform="translate(1104 300)">
    <path d="M0 46 c0 -34 14 -52 34 -56 v-8 a10 10 0 0 1 20 0 v8 c20 4 34 22 34 56 l10 22 h-108 z"
          fill="#FB923C" opacity=".92"/>
    <circle cx="44" cy="82" r="12" fill="#F7F4EE"/>
    <g stroke="#FB923C" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7">
      <path d="M-18 22 a40 40 0 0 0 0 52"/>
      <path d="M106 22 a40 40 0 0 1 0 52"/>
    </g>
  </g>
  <g stroke="#93C5FD" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6" transform="translate(1090 440)">
    <path d="M0 0 v40 M22 -10 v60 M44 0 v40 M66 -8 v56 M88 2 v36"/>
  </g>

  <g fill="#93C5FD">
    <circle cx="1180" cy="120" r="6" opacity=".7"/>
    <circle cx="110" cy="240" r="5" opacity=".6"/>
    <circle cx="560" cy="700" r="4" opacity=".5"/>
  </g>
</svg>
