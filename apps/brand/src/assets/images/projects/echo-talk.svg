<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="插画：手机里是一句话的转写气泡与洞察卡，右侧分出三张回复卡，左侧有一串声波">
  <defs>
    <linearGradient id="et-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#171029"/>
    </linearGradient>
    <radialGradient id="et-i" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4F46E5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="et-c" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="et-p" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#334155" fill-opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#et-bg)"/>
  <rect width="1280" height="800" fill="url(#et-p)"/>
  <ellipse cx="250" cy="190" rx="330" ry="250" fill="url(#et-i)"/>
  <ellipse cx="1060" cy="660" rx="300" ry="220" fill="url(#et-c)"/>

  <!-- 声波 -->
  <g fill="#22D3EE" transform="translate(120 430)">
    <rect x="0" y="26" width="12" height="28" rx="6"/>
    <rect x="26" y="10" width="12" height="60" rx="6"/>
    <rect x="52" y="0" width="12" height="80" rx="6"/>
    <rect x="78" y="20" width="12" height="40" rx="6"/>
    <rect x="104" y="6" width="12" height="68" rx="6"/>
    <rect x="130" y="30" width="12" height="20" rx="6"/>
  </g>

  <!-- 手机：会话页 -->
  <g transform="rotate(-6 470 400)">
    <rect x="342" y="130" width="256" height="540" rx="40" fill="#161f33" stroke="#2A3A5C" stroke-width="3"/>
    <rect x="358" y="148" width="224" height="504" rx="30" fill="#0C1424"/>
    <rect x="436" y="160" width="68" height="9" rx="4.5" fill="#1E2B44"/>
    <!-- 录音状态 + 说话人切换 -->
    <rect x="376" y="184" width="190" height="40" rx="14" fill="#16213A"/>
    <circle cx="396" cy="204" r="7" fill="#F43F5E"/>
    <rect x="412" y="198" width="52" height="8" rx="4" fill="#94A3B8"/>
    <rect x="524" y="194" width="34" height="20" rx="10" fill="#4F46E5"/>
    <!-- 定稿气泡 -->
    <rect x="376" y="240" width="180" height="58" rx="16" fill="#1E1B4B" stroke="#4F46E5" stroke-width="2"/>
    <rect x="392" y="258" width="126" height="9" rx="4.5" fill="#C7D2FE"/>
    <rect x="392" y="276" width="84" height="8" rx="4" fill="#818CF8" opacity=".7"/>
    <!-- 洞察卡 -->
    <rect x="376" y="314" width="190" height="132" rx="18" fill="#16213A"/>
    <rect x="394" y="332" width="72" height="9" rx="4.5" fill="#A5B4FC"/>
    <g fill="#818CF8">
      <rect x="394" y="356" width="146" height="8" rx="4"/>
      <rect x="394" y="374" width="120" height="8" rx="4" opacity=".8"/>
      <rect x="394" y="392" width="158" height="8" rx="4" opacity=".62"/>
      <rect x="394" y="410" width="96" height="8" rx="4" opacity=".45"/>
    </g>
    <!-- 输入与发送 -->
    <rect x="376" y="462" width="140" height="38" rx="14" fill="#111A2C" stroke="#243252" stroke-width="2"/>
    <rect x="392" y="478" width="70" height="8" rx="4" fill="#243252"/>
    <circle cx="546" cy="481" r="19" fill="#4F46E5"/>
    <path d="M539 475 l13 6 l-13 6 z" fill="#E0E7FF"/>
    <!-- tab -->
    <g fill="#243252">
      <circle cx="428" cy="576" r="11"/>
      <circle cx="470" cy="576" r="11" fill="#4F46E5"/>
      <circle cx="512" cy="576" r="11"/>
    </g>
  </g>

  <!-- 三张回复卡 -->
  <g>
    <rect x="690" y="190" width="332" height="86" rx="22" fill="#16213A" stroke="#2A3A5C" stroke-width="2"/>
    <rect x="712" y="212" width="50" height="10" rx="5" fill="#22D3EE"/>
    <rect x="712" y="234" width="220" height="9" rx="4.5" fill="#94A3B8"/>
    <circle cx="990" cy="233" r="15" fill="#0B1220" stroke="#22D3EE" stroke-width="2"/>
    <path d="M984 233 h12 M990 227 v12" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="712" y="292" width="310" height="86" rx="22" fill="#16213A" stroke="#2A3A5C" stroke-width="2"/>
    <rect x="734" y="314" width="44" height="10" rx="5" fill="#818CF8"/>
    <rect x="734" y="336" width="196" height="9" rx="4.5" fill="#94A3B8"/>
  </g>
  <g>
    <rect x="734" y="394" width="288" height="86" rx="22" fill="#16213A" stroke="#2A3A5C" stroke-width="2"/>
    <rect x="756" y="416" width="38" height="10" rx="5" fill="#FB923C"/>
    <rect x="756" y="438" width="176" height="9" rx="4.5" fill="#94A3B8"/>
  </g>

  <g stroke="#4F46E5" stroke-width="3" fill="none" opacity=".7">
    <path d="M620 330 C 660 330 664 233 700 233"/>
    <path d="M620 350 C 664 350 668 335 714 335"/>
    <path d="M620 370 C 668 370 672 438 748 438"/>
  </g>

  <!-- 服务链条：网关 → Agent → 落库 -->
  <g transform="translate(700 560)">
    <rect x="0" y="0" width="330" height="76" rx="22" fill="#111A2C" stroke="#2A3A5C" stroke-width="2"/>
    <g fill="#4F46E5">
      <circle cx="46" cy="38" r="15"/>
      <circle cx="165" cy="38" r="15" fill="#22D3EE"/>
      <circle cx="284" cy="38" r="15" fill="#8B5CF6"/>
    </g>
    <g stroke="#334155" stroke-width="3">
      <path d="M61 38 h88"/>
      <path d="M180 38 h88"/>
    </g>
    <rect x="26" y="58" width="40" height="6" rx="3" fill="#243252"/>
    <rect x="145" y="58" width="40" height="6" rx="3" fill="#243252"/>
    <rect x="264" y="58" width="40" height="6" rx="3" fill="#243252"/>
  </g>

  <!-- 不留音频：波形被折进文本 -->
  <g transform="translate(1040 150)">
    <rect x="0" y="0" width="150" height="112" rx="24" fill="#1E1B4B" stroke="#4F46E5" stroke-width="2" opacity=".9"/>
    <g stroke="#A5B4FC" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M30 60 q14 -22 28 0 q14 22 28 0"/>
    </g>
    <rect x="30" y="82" width="90" height="8" rx="4" fill="#818CF8" opacity=".8"/>
    <path d="M96 30 l30 30 M126 30 l-30 30" stroke="#F43F5E" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  </g>

  <g fill="#A5B4FC">
    <circle cx="1150" cy="120" r="6" opacity=".7"/>
    <circle cx="120" cy="540" r="5" opacity=".6"/>
    <circle cx="230" cy="700" r="4" opacity=".5"/>
  </g>
</svg>
