<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="插画：编排节点连接多个垂直 Agent，右侧是流式回答的气泡与声波">
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10091F"/>
      <stop offset="0.6" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E1A2E"/>
    </linearGradient>
    <radialGradient id="ai-v" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai-b" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0161EF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#0161EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ai-p" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#334155" fill-opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#ai-bg)"/>
  <rect width="1280" height="800" fill="url(#ai-p)"/>
  <ellipse cx="360" cy="200" rx="340" ry="250" fill="url(#ai-v)"/>
  <ellipse cx="1060" cy="620" rx="300" ry="220" fill="url(#ai-b)"/>

  <!-- 雷达环 -->
  <g fill="none" stroke="#243252" stroke-width="3" opacity=".9">
    <circle cx="360" cy="400" r="120"/>
    <circle cx="360" cy="400" r="196"/>
    <circle cx="360" cy="400" r="272"/>
  </g>

  <!-- 编排节点 -->
  <g transform="translate(268 320)">
    <rect width="184" height="160" rx="28" fill="#16213A" stroke="#8B5CF6" stroke-width="4"/>
    <circle cx="92" cy="56" r="24" fill="#8B5CF6"/>
    <path d="M82 56 h20 M92 46 v20" stroke="#F7F4EE" stroke-width="6" stroke-linecap="round"/>
    <rect x="34" y="100" width="116" height="12" rx="6" fill="#93C5FD"/>
    <rect x="52" y="126" width="80" height="9" rx="4.5" fill="#334155"/>
  </g>

  <!-- 分支连线 -->
  <g fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round">
    <path d="M452 372 q90 -140 200 -160"/>
    <path d="M452 400 h200"/>
    <path d="M452 428 q90 140 200 160"/>
  </g>
  <g fill="#0161EF">
    <circle cx="560" cy="288" r="9"/>
    <circle cx="620" cy="400" r="9"/>
    <circle cx="560" cy="512" r="9"/>
  </g>

  <!-- 三个垂直 Agent -->
  <g transform="translate(664 176)">
    <rect width="196" height="112" rx="24" fill="#16213A" stroke="#2A3A5C" stroke-width="3"/>
    <circle cx="42" cy="56" r="16" fill="#FB923C"/>
    <rect x="72" y="40" width="98" height="12" rx="6" fill="#93C5FD"/>
    <rect x="72" y="66" width="70" height="9" rx="4.5" fill="#334155"/>
  </g>
  <g transform="translate(664 344)">
    <rect width="196" height="112" rx="24" fill="#16213A" stroke="#0161EF" stroke-width="4"/>
    <circle cx="42" cy="56" r="16" fill="#0161EF"/>
    <rect x="72" y="40" width="98" height="12" rx="6" fill="#93C5FD"/>
    <rect x="72" y="66" width="70" height="9" rx="4.5" fill="#334155"/>
  </g>
  <g transform="translate(664 512)">
    <rect width="196" height="112" rx="24" fill="#111A2C" stroke="#243252" stroke-width="3"/>
    <circle cx="42" cy="56" r="16" fill="#8B5CF6"/>
    <rect x="72" y="40" width="98" height="12" rx="6" fill="#334155"/>
    <rect x="72" y="66" width="70" height="9" rx="4.5" fill="#1F2A44"/>
  </g>

  <!-- 检索：向量点阵 -->
  <g transform="translate(900 232)">
    <rect width="240" height="150" rx="24" fill="#111A2C" stroke="#2A3A5C" stroke-width="3"/>
    <g fill="#34D399" opacity=".85">
      <circle cx="40" cy="40" r="7"/>
      <circle cx="86" cy="70" r="7"/>
      <circle cx="140" cy="46" r="7"/>
      <circle cx="186" cy="96" r="7"/>
      <circle cx="66" cy="112" r="7"/>
      <circle cx="150" cy="118" r="7"/>
    </g>
    <g stroke="#0161EF" stroke-width="3" opacity=".8">
      <path d="M40 40 L86 70 L140 46 M86 70 L66 112 M140 46 L186 96 L150 118"/>
    </g>
  </g>

  <!-- 流式回答气泡 -->
  <g transform="translate(900 452)">
    <rect width="272" height="176" rx="30" fill="#16213A" stroke="#2A3A5C" stroke-width="3"/>
    <rect x="28" y="32" width="150" height="12" rx="6" fill="#8B5CF6"/>
    <rect x="28" y="60" width="216" height="10" rx="5" fill="#334155"/>
    <rect x="28" y="84" width="180" height="10" rx="5" fill="#334155"/>
    <rect x="28" y="108" width="120" height="10" rx="5" fill="#334155"/>
    <g fill="#93C5FD">
      <circle cx="44" cy="146" r="8"/>
      <circle cx="70" cy="146" r="8" opacity=".6"/>
      <circle cx="96" cy="146" r="8" opacity=".3"/>
    </g>
  </g>

  <!-- 声波 -->
  <g fill="#FB923C" transform="translate(180 560)">
    <rect x="0" y="24" width="12" height="28" rx="6"/>
    <rect x="26" y="10" width="12" height="56" rx="6"/>
    <rect x="52" y="0" width="12" height="76" rx="6"/>
    <rect x="78" y="18" width="12" height="40" rx="6"/>
    <rect x="104" y="6" width="12" height="64" rx="6"/>
    <rect x="130" y="28" width="12" height="20" rx="6"/>
  </g>

  <g fill="#93C5FD">
    <circle cx="1180" cy="150" r="6" opacity=".7"/>
    <circle cx="120" cy="180" r="5" opacity=".6"/>
  </g>
</svg>
