[project]
name = "po-agent-novel"
version = "0.1.0"
description = "小说创作垂直 Agent：构思→大纲→逐章生成与反思循环→归档确认（经 po-agent-core 插槽接入 supervisor）"
requires-python = ">=3.11"
dependencies = [
    "po-agent-core",
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# po-agent-core 与本包均不在 PyPI，需先在 chat venv 里按序安装本地包：
#   pip install -e "../agent-core[dev]"
#   pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
