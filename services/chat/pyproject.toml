[project]
name = "po-chat"
version = "0.1.0"
description = "FastAPI service with REST CRUD and WebSocket streaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "po-agent-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# po-agent-core 不在 PyPI，需先在 chat venv 里安装本地包：
#   pip install -e "../agent-core[dev]"
#   pip install -e ".[dev]"
# 仓库根命令 pnpm chat:install 会按正确顺序完成两步安装

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
