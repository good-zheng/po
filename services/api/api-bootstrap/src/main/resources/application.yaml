# ==========================
# Spring 核心配置
# ==========================
server:
  # 统一 /api 前缀是前后端 REST 契约的一部分，所有环境一致；
  # Nginx 网关将 ^~ /api/ 原样转发（含前缀），由 context-path 消费
  servlet:
    context-path: /api

spring:
  application:
    name: po-app
  # 激活开发环境配置
  profiles:
    active:
      - local

  # 建表脚本：替代原 JPA ddl-auto: update，启动时执行 schema.sql（幂等，CREATE TABLE IF NOT EXISTS）
  sql:
    init:
      mode: always

  # 文件上传限制配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true

  # 静态资源配置（file:uploads/ 用于暴露本地上传的文件，如头像 /api/avatars/**；
  # classpath:/static/ 用于种子图片，如菜谱封面 /api/covers/**、食材图 /api/ingredients/**）
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:uploads/
      cache:
        period: 3600

# ==========================
# MyBatis-Plus 配置
# ==========================
mybatis-plus:
  # XML mapper 位置：各业务模块 src/main/resources/mapper/*.xml，与 Mapper 接口同名
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      # 主键自增（等价 @TableId(type = IdType.AUTO)）
      id-type: auto
      # 更新策略 always：等价原 JPA merge 全字段语义（全部字段无条件写入，createTime 等由实体上 updateStrategy=NEVER 兜底）
      update-strategy: always
  configuration:
    # 打印 SQL（等价原 JPA show-sql: true）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==========================
# Actuator 监控配置
# ==========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ==========================
# 自定义业务配置
# ==========================
app:
  name: po
  version: 1.0.0
  description: 破

# ==========================
# JWT 配置
# ==========================
# 密钥不落库不入库：生产用环境变量 JWT_SECRET 注入（Base64），
# 本地开发值放在 application-local.yaml（已被 .gitignore 排除）。
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}