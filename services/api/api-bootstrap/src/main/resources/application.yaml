# ==========================
# Spring 核心配置
# ==========================
server:
  # 统一 /api 前缀是前后端 REST 契约的一部分，所有环境一致；
  # Nginx 网关将 ^~ /api/ 原样转发（含前缀），由 context-path 消费
  servlet:
    context-path: /api

spring:
  application:
    name: po-app
  # 激活开发环境配置
  profiles:
    active:
      - local

  # 建表脚本：替代原 JPA ddl-auto: update，启动时执行 schema.sql（幂等，CREATE TABLE IF NOT EXISTS）
  sql:
    init:
      mode: always

  # 文件上传限制配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true

  # 静态资源配置（file:uploads/ 用于暴露本地上传的文件，如头像 /api/avatars/**；
  # classpath:/static/ 用于种子图片，如菜谱封面 /api/covers/**、食材图 /api/ingredients/**）
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:uploads/
      cache:
        period: 3600

# ==========================
# MyBatis-Plus 配置
# ==========================
mybatis-plus:
  # XML mapper 位置：各业务模块 src/main/resources/mapper/*.xml，与 Mapper 接口同名
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      # 主键自增（等价 @TableId(type = IdType.AUTO)）
      id-type: auto
      # 更新策略 always：等价原 JPA merge 全字段语义（全部字段无条件写入，createTime 等由实体上 updateStrategy=NEVER 兜底）
      update-strategy: always
  configuration:
    # 打印 SQL（等价原 JPA show-sql: true）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ==========================
# Actuator 监控配置
# ==========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ==========================
# 自定义业务配置
# ==========================
app:
  name: po
  version: 1.0.0
  description: 破
  # chat 服务（agent-talk）回调 /talk/internal/** 落库用的内网令牌；
  # 未配置时该端点一律拒绝。生产由环境变量 APP_INTERNAL_TOKEN 注入
  internal-token: ${APP_INTERNAL_TOKEN:}

# ==========================
# JWT 配置
# ==========================
# 密钥不落库不入库：生产用环境变量 JWT_SECRET 注入（Base64），
# 本地开发值放在 application-local.yaml（已被 .gitignore 排除）。
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# ==========================
# 微信小程序配置
# ==========================
wechat:
  mini:
    app-id: ${WECHAT_MINI_APP_ID:}
    app-secret: ${WECHAT_MINI_APP_SECRET:}
    # 微信接口基址：本地/公网默认 https；微信云托管内开启「开放接口服务」后走内网明文 http
    # （云托管内网 TLS 中间层证书不在 JDK cacerts 内，https 会 PKIX 失败）
    api-base-url: ${WECHAT_API_BASE_URL:https://api.weixin.qq.com}

# ==========================
# 讯飞语音合成（TTS v2，WebSocket）
# 密钥仅从环境变量注入，不落库不入库；本地 IDE 运行配置或根 .env 提供
# ==========================
xfyun:
  tts:
    app-id: ${IFLYTEK_APP_ID:}
    api-key: ${IFLYTEK_API_KEY:}
    api-secret: ${IFLYTEK_API_SECRET:}
    vcn: ${IFLYTEK_TTS_VCN:xiaoyan}
  # 语音听写（IAT v2，WebSocket）：与 TTS 共用同一套 hmac-sha256 签名（shared 的 XfyunSigner）
  # 本地密钥写在 application-local.yaml 的 xfyun.iat 下（已被 .gitignore 排除），此处仅作默认值/容器环境变量回退
  # max-seconds 是单个讯飞会话的时长上限，讯飞硬限制 60s，留 5s 余量主动收尾重开
  iat:
    app-id: ${IFLYTEK_APP_ID:}
    api-key: ${IFLYTEK_API_KEY:}
    api-secret: ${IFLYTEK_API_SECRET:}
    language: ${IFLYTEK_ASR_LANGUAGE:zh_cn}
    accent: ${IFLYTEK_ASR_ACCENT:mandarin}
    max-seconds: ${IFLYTEK_ASR_MAX_SECONDS:55}

# ==========================
# 腾讯云 COS 对象存储（头像 / 通用上传 / TTS 音频落桶）
# 密钥仅从环境变量注入，不落库、不打进镜像；桶与地域为非密钥，给默认值
# ==========================
cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-shanghai}
  bucket: ${COS_BUCKET:7072-prod-d7g3zal0655a67232-1496875399}
  key-prefix: ${COS_KEY_PREFIX:po}
  # 自定义 CDN / 静态域名；留空则用 https://{bucket}.cos.{region}.myqcloud.com
  base-url: ${COS_BASE_URL:}