[project]
name = "po-agent-core"
version = "0.1.0"
description = "po monorepo 智能体编排核心库：semantic-router 决策、supervisor 编排、记忆、MCP/A2A 协议适配（框架无关，禁止依赖 Web 框架）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.6,<2",
    "semantic-router>=0.1.16,<0.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
redis = ["langgraph-checkpoint-redis>=0.5,<0.6"]
sqlite = ["langgraph-checkpoint-sqlite>=3.1,<4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
