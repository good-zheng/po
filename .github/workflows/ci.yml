name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # HUSKY=0 跳过 git hooks 安装，CI 内无需
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # admin 的 tsc 依赖 @po/types 产物，先构建共享类型包
      - name: Build shared types
        run: pnpm types:build

      - name: Lint (biome + tsc)
        run: pnpm admin:lint

      - name: Test (vitest)
        run: pnpm admin:test

      - name: Build admin bundle
        run: pnpm admin:build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # @po/types 的 exports 只指向 dist/，App 源码引用其类型，先构建共享类型包
      - name: Build shared types
        run: pnpm types:build

      - name: Lint
        run: pnpm mobile:lint

      - name: Type check
        run: pnpm mobile:typecheck

      - name: Test
        run: pnpm --filter @po/cooking exec jest --runInBand

  mini:
    name: Mini program (Taro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # cooking-mini 有十余处 import type 来自 @po/types，必须先构建 dist 才能解析
      - name: Build shared types
        run: pnpm types:build

      # 主包限额 2M：构建产物超限在这里挡住，而不是等到上传小程序时才失败
      - name: Build weapp bundle
        run: pnpm mini:build

  brand:
    name: Brand site (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # brand 的 engines 要求 node >=22.22.3；仓库未开 engine-strict，这里只告警不阻断
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      # 只跑 types + build，不跑 eslint/prettier：历史格式债会把门禁直接变红
      - name: Type check (.astro)
        run: pnpm --filter @po/brand exec astro check

      - name: Build static site
        run: pnpm --filter @po/brand exec astro build

  api:
    name: API (Java 17 + Maven)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: po
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        # 必须是 Redis Stack：langgraph 的 redis checkpointer 用 RedisJSON/RediSearch，
        # 普通镜像会让 chat 静默降级为 memory checkpointer。与 docker-compose.yml 保持一致。
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # application-local.yaml 被 .gitignore 排除，CI 用环境变量注入等价配置
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/po?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      # 占位密钥，仅供 CI 测试（与 .env.example 中的开发占位值相同）
      JWT_SECRET: cG8tbG9jYWwtZGV2LWp3dC1zZWNyZXQtY2hhbmdlLW1lLTAxMjM0NTY3ODlhYmNkZWY=
      JWT_EXPIRATION: 86400000
      APP_SEED_DEFAULT_ADMIN: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: 'services/api/**/pom.xml'

      - name: Verify (unit tests + context load)
        run: mvn -B -f services/api/pom.xml verify

  chat:
    name: Chat & Agents (Python 3.11 + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/chat/pyproject.toml
            services/agent-core/pyproject.toml
            services/agent-cooking/pyproject.toml
            services/agent-talk/pyproject.toml
            services/agent-novel/pyproject.toml

      # 四个本地包都不在 PyPI，必须先于 chat 按依赖序 editable 安装
      # （chat 的 pyproject 已把它们列为依赖，少装一个则 pip install -e . 直接失败）
      - name: Install agent packages then chat
        run: |
          pip install -e '../agent-core[dev]'
          pip install -e '../agent-cooking[dev]'
          pip install -e '../agent-talk[dev]'
          pip install -e '../agent-novel[dev]'
          pip install -e '.[dev]'

      - name: Test agent-core (pytest)
        run: python -m pytest ../agent-core/tests

      - name: Test agent-cooking (pytest)
        run: python -m pytest ../agent-cooking/tests

      - name: Test agent-talk (pytest)
        run: python -m pytest ../agent-talk/tests

      - name: Test agent-novel (pytest)
        run: python -m pytest ../agent-novel/tests

      # PRD §12.1 的一致性黄金集门禁：闸门召回/误报、抽取误采、别名归一四组阈值加覆盖台账。
      # 单独一条 step（而不是并进上一条）：门禁转红时要立刻分清「闸门退化」还是「用例本身坏了」；
      # 放在 Python job 里，不进前端/API 的主线构建时长——换模型、改提示词、改阈值都由它兜住。
      - name: Novel consistency golden set gate (PRD 12.1)
        run: python -m pytest ../agent-novel/tests/test_golden.py -q

      # PRD §12 / N6 的离线半程：50 章规模下的注入上限（G2「P95 ≤ 4k」）、降级计数、
      # 幂等重放与 as-of 边界。零模型消耗、零 MySQL，所以能常驻每次 PR；
      # 真实召回/真实耗时/真实计费仍只在作者点头的长测里跑，别把这条当成那半程的替身。
      - name: Novel long-run metrics gate (PRD 12 / N6 offline)
        run: python -m pytest ../agent-novel/tests/test_longrun_metrics.py -q

      - name: Test chat (pytest)
        run: python -m pytest tests
