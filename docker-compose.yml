# po 全栈编排：mysql + redis + api(Spring Boot) + chat(FastAPI) + web(Nginx 网关)
# 使用方式：cp .env.example .env && docker compose up -d --build
# 网关入口：http://localhost:${WEB_PORT}

name: po

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-po}
      MYSQL_USER: ${MYSQL_USER:-po}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 仅在 compose 内部网络访问，未暴露宿主机端口；如需密码可加 --requirepass
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      # 12 因子注入：环境变量优先级高于 yaml，容器内不含 application-local.yaml
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-po}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-po}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（Base64，解码后至少 32 字节）}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_SEED_DEFAULT_ADMIN: ${APP_SEED_DEFAULT_ADMIN:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # server.servlet.context-path=/api 同时作用于 actuator
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  chat:
    build: ./services/chat
    environment:
      PY_SERVER_CORS_ORIGINS: ${PY_SERVER_CORS_ORIGINS:-http://localhost:8000}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5090/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      chat:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
