# po 全栈编排：mysql + redis + api(Spring Boot) + chat(FastAPI) + web(Nginx 网关)
# 使用方式：cp .env.example .env && docker compose up -d --build
# 网关入口：http://localhost:${WEB_PORT}

name: po

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-po}
      MYSQL_USER: ${MYSQL_USER:-po}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 与 application-local.yaml 的 spring.data.redis.password 保持一致
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-123456} ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      # 12 因子注入：环境变量优先级高于 yaml，容器内不含 application-local.yaml
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-po}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-po}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（Base64，解码后至少 32 字节）}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_SEED_DEFAULT_ADMIN: ${APP_SEED_DEFAULT_ADMIN:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # server.servlet.context-path=/api 同时作用于 actuator
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  chat:
    build:
      # 本地 Python 包（agent-core / agent-cooking）不在 PyPI，构建上下文必须是仓库根
      context: .
      dockerfile: services/chat/Dockerfile
    environment:
      PY_SERVER_CORS_ORIGINS: ${PY_SERVER_CORS_ORIGINS:-http://localhost:8000}
      # 烹饪助手插槽读菜谱走 compose 内网，不能沿用默认的 localhost
      COOKING_API_BASE_URL: http://api:8080/api
      # LLM 与 embedding 从根 .env 透传；未配置时聊天服务降级为离线模型而非启动失败
      AGENT_CORE_LLM_PROVIDER: ${AGENT_CORE_LLM_PROVIDER:-qwen}
      AGENT_CORE_LLM_MODEL: ${AGENT_CORE_LLM_MODEL:-qwen-plus}
      AGENT_CORE_LLM_API_KEY: ${AGENT_CORE_LLM_API_KEY:-}
      AGENT_CORE_EMBEDDING_MODEL: ${AGENT_CORE_EMBEDDING_MODEL:-}
      AGENT_CORE_EMBEDDING_API_KEY: ${AGENT_CORE_EMBEDDING_API_KEY:-}
      AGENT_CORE_CHECKPOINTER: ${AGENT_CORE_CHECKPOINTER:-redis}
      AGENT_CORE_REDIS_URL: redis://:${REDIS_PASSWORD:-123456}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      # 菜谱接口来自 api 服务；它没起来时工具会返回可读错误，但先等就绪可少一轮空查
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5090/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      chat:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:
