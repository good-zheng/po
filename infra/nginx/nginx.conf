# po 网关：统一入口，按前缀分流到前端静态资源 / FastAPI 聊天服务 / Spring Boot API
#
# 分流规则：
#   /                    -> Umi 静态前端（SPA，history 路由回退到 index.html）
#   /ws/chat             -> FastAPI WebSocket（chat:5090）
#   /api/health          -> FastAPI（chat:5090）
#   /api/items...        -> FastAPI（chat:5090）
#   /api/** 其余请求      -> Spring Boot（api:8080，server.servlet.context-path=/api 已含前缀）
#
# 挂载方式：docker-compose 将本文件只读挂载到 /etc/nginx/nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 与 Spring multipart 上限对齐（max-request-size=100MB）
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # WebSocket 升级所需的 Connection 头映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream spring_api {
        server api:8080;
    }

    upstream chat_api {
        server chat:5090;
    }

    server {
        listen 80;
        server_name _;

        # Umi 按路由生成目录（/recipes/ 等），nginx 补斜杠时发出相对重定向，
        # 避免把容器内 80 端口写进 Location 丢掉外部端口（如 :8000）
        absolute_redirect off;

        # ---------- FastAPI：WebSocket 聊天 ----------
        # ^~ 确保带扩展名的 API 路径不被下方静态资源正则截胡
        location ^~ /ws/chat {
            proxy_pass http://chat_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 长连接：流式回复期间不中断
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- FastAPI：健康检查 ----------
        location = /api/health {
            proxy_pass http://chat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- FastAPI：items CRUD ----------
        location ^~ /api/items {
            proxy_pass http://chat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Spring Boot：其余 /api/**（auth/users/recipes 等 + actuator）----------
        location ^~ /api/ {
            proxy_pass http://spring_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Umi 静态前端 ----------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源带 hash 可长缓存；入口 HTML 不缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri /index.html;
        }
    }
}
